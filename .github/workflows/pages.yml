name: Deploy demo to GitHub Pages

# v2.2.0: bilingual build — runs Astro twice, once with PUBLIC_LANGUAGE=zh
# (mounted at /) and once with PUBLIC_LANGUAGE=en (mounted at /en/). The en
# build is merged into the zh dist as a subdirectory before upload. Header
# language toggle navigates between sibling deployments.
#
# Content lives in template-site/src/content/{textbook,concept-explainers}/<lang>/.
# If en/ is empty (only en/curriculum.json and en/manifest.json placeholders),
# the en build still succeeds but shows the empty-state pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: template-site/package-lock.json

      - name: Install template-site deps
        working-directory: template-site
        run: npm ci

      - name: Build zh (mounted at /)
        working-directory: template-site
        env:
          PUBLIC_LANGUAGE: zh
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          mv dist dist-zh

      - name: Build en (mounted at /en/)
        working-directory: template-site
        env:
          PUBLIC_LANGUAGE: en
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/en/
        run: |
          npm run build
          mv dist dist-en

      - name: Merge dist (zh at /, en at /en/)
        working-directory: template-site
        run: |
          mkdir -p dist-zh/en
          cp -r dist-en/. dist-zh/en/
          mv dist-zh dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
