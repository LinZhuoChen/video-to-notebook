name: Deploy demo to GitHub Pages

# v2.2.0: bilingual build — runs Astro twice, once with PUBLIC_LANGUAGE=zh
# (mounted at /) and once with PUBLIC_LANGUAGE=en (mounted at /en/). The en
# build is merged into the zh dist as a subdirectory before upload. Header
# language toggle navigates between sibling deployments.
#
# v2.3.0: template-site/src/content/ is now an empty scaffold (the v2.2
# demo data was moved to examples/diffusion-bilingual-demo/ to stop it
# leaking into newly-init'd downstream projects via template_copy). To
# keep the public demo site alive without re-polluting the template, we
# overlay examples/diffusion-bilingual-demo/content/ on top of
# template-site/src/content/ as a CI-only step, right before the Astro
# build. The git-tracked tree stays clean; only this ephemeral
# checkout sees the demo content.
#
# Cleanliness invariants enforced by tests in tests/unit/test_template_copy.py
# (test_template_site_has_no_demo_data) run in ci.yml against a fresh
# checkout, so this overlay does NOT affect them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: template-site/package-lock.json

      - name: Install template-site deps
        working-directory: template-site
        run: npm ci

      - name: Overlay diffusion-bilingual demo content into template-site
        run: |
          set -euo pipefail
          demo=examples/diffusion-bilingual-demo/content
          dst=template-site/src/content
          test -d "$demo" || { echo "demo dir missing: $demo"; exit 1; }
          cp -R "$demo/." "$dst/"
          echo "Overlay complete. Sample counts:"
          find "$dst/concept"             -name '*.md'   | wc -l | xargs echo "  concept .md:"
          find "$dst/course"              -name '*.md'   | wc -l | xargs echo "  course  .md:"
          find "$dst/lecture"             -name '*.md'   | wc -l | xargs echo "  lecture .md:"
          find "$dst/textbook"            -name '*.html' | wc -l | xargs echo "  textbook .html:"
          find "$dst/concept-explainers"  -name '*.html' | wc -l | xargs echo "  concept-explainers .html:"

      - name: Build zh (mounted at /)
        working-directory: template-site
        env:
          PUBLIC_LANGUAGE: zh
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          mv dist dist-zh

      - name: Build en (mounted at /en/)
        working-directory: template-site
        env:
          PUBLIC_LANGUAGE: en
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/en/
        run: |
          npm run build
          mv dist dist-en

      - name: Merge dist (zh at /, en at /en/)
        working-directory: template-site
        run: |
          mkdir -p dist-zh/en
          cp -r dist-en/. dist-zh/en/
          mv dist-zh dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
