name: Deploy demo to GitHub Pages

# v2.0.0: deploys an empty Astro shell — site chrome, navigation, dark mode,
# KaTeX, Pagefind index of the about page. Chapters and concept pages surface
# their empty states. To deploy a populated demo, run the pipeline locally
# (`bash examples/frontier-notebook/build.sh`) and commit the generated
# `template-site/src/content/textbook/*.html` + curriculum.json + concept
# explainer manifest + fragments, then push — the workflow will pick them up.

on:
  push:
    branches: [main]
    paths:
      - 'template-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: template-site/package-lock.json

      - name: Install template-site deps
        working-directory: template-site
        run: npm ci

      - name: Build Astro site (English)
        working-directory: template-site
        env:
          PUBLIC_LANGUAGE: en
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
