<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="video-to-notebook knowledge graph notebook">
  <title>video-to-notebook — Knowledge-graph notebook</title>
  <!-- notebook outline + binding rings -->
  <rect x="10" y="6" width="46" height="52" rx="2.5"
        fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
  <!-- left-edge spiral binding (three rings) -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="10" y1="14" x2="6" y2="14" />
    <line x1="10" y1="32" x2="6" y2="32" />
    <line x1="10" y1="50" x2="6" y2="50" />
  </g>
  <!-- graph edges (drawn before nodes so circles sit on top) -->
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.65">
    <line x1="22" y1="20" x2="33" y2="32" />
    <line x1="44" y1="20" x2="33" y2="32" />
    <line x1="33" y1="32" x2="22" y2="46" />
    <line x1="33" y1="32" x2="44" y2="46" />
    <line x1="22" y1="20" x2="44" y2="20" />
  </g>
  <!-- five concept nodes -->
  <g fill="currentColor">
    <circle cx="22" cy="20" r="3" />
    <circle cx="44" cy="20" r="3" />
    <circle cx="33" cy="32" r="3.4" />
    <circle cx="22" cy="46" r="3" />
    <circle cx="44" cy="46" r="3" />
  </g>
</svg>
