<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64" role="img" aria-label="video-to-notebook monogram v2n">
  <title>video-to-notebook — Editorial monogram v2n</title>
  <!-- thin square frame around the mark, optical bookplate look -->
  <rect x="2" y="2" width="116" height="60" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" />
  <!-- v 2 n  — Source Serif Pro fallback chain; the 2 is italic for scholarly cadence -->
  <g font-family="'Source Serif 4', 'Source Serif Pro', 'Source Serif', 'Iowan Old Style', 'Palatino', 'Georgia', serif"
     fill="currentColor" font-weight="600" letter-spacing="-0.01em">
    <text x="22" y="46" font-size="44" font-weight="600">v</text>
    <text x="52" y="46" font-size="44" font-style="italic" font-weight="500">2</text>
    <text x="82" y="46" font-size="44" font-weight="600">n</text>
  </g>
  <!-- micro caption beneath the frame -->
  <text x="60" y="78" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
        font-size="8" letter-spacing="0.22em" fill="currentColor" opacity="0.7">
    VIDEO · TO · NOTEBOOK
  </text>
</svg>
