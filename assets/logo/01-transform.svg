<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="video-to-notebook transform glyph"
     fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>video-to-notebook — Transform glyph</title>
  <!-- open book / notebook outline (two pages meeting at center spine) -->
  <path d="M 32 16 C 24 12 14 12 6 14 L 6 50 C 14 48 24 48 32 52 Z" />
  <path d="M 32 16 C 40 12 50 12 58 14 L 58 50 C 50 48 40 48 32 52 Z" />
  <!-- spine highlight (short tick at top + bottom) -->
  <line x1="32" y1="16" x2="32" y2="20" stroke-width="2.2" />
  <line x1="32" y1="48" x2="32" y2="52" stroke-width="2.2" />
  <!-- left page: play triangle (the "video" being watched) -->
  <path d="M 14 24 L 14 38 L 25 31 Z" fill="currentColor" stroke="none" />
  <!-- right page: three note-lines (the "notebook" being written) -->
  <line x1="38" y1="25" x2="54" y2="26" stroke-width="2" />
  <line x1="38" y1="31" x2="54" y2="32" stroke-width="2" />
  <line x1="38" y1="37" x2="50" y2="38" stroke-width="2" />
</svg>
