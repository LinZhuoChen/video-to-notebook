<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="video-to-notebook"
     fill="none" stroke="currentColor" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
  <title>video-to-notebook</title>
  <!-- open notebook, two pages meeting at the spine -->
  <path d="M 32 17 C 24 13 14 13 6 15 L 6 49 C 14 47 24 47 32 51 Z" />
  <path d="M 32 17 C 40 13 50 13 58 15 L 58 49 C 50 47 40 47 32 51 Z" />
  <!-- spine ticks (top + bottom) for grounding -->
  <line x1="32" y1="14" x2="32" y2="19" />
  <line x1="32" y1="49" x2="32" y2="54" />
  <!-- left page: filled play triangle (the "video") -->
  <path d="M 15 25 L 15 39 L 26 32 Z" fill="currentColor" stroke="none" />
  <!-- right page: three written note-lines (the "notebook") -->
  <line x1="38" y1="26" x2="53" y2="27" stroke-width="2.2" />
  <line x1="38" y1="32" x2="53" y2="33" stroke-width="2.2" />
  <line x1="38" y1="38" x2="48" y2="39" stroke-width="2.2" />
</svg>
