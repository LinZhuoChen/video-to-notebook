[project]
name = "video-to-notebook"
version = "2.0.0"
description = "Crawl open-courseware video playlists, tag with concepts via Claude / Codex / any agent, and render an interactive cross-course study notebook + concept encyclopedia"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "chenlinzhuo" }]
keywords = [
    "education",
    "notebook",
    "textbook",
    "course-merger",
    "youtube",
    "bilibili",
    "claude",
    "anthropic",
    "openai-codex",
    "ai-tutor",
    "knowledge-graph",
    "self-study",
    "agent-driven",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "yt-dlp>=2024.5.0",
    "pyyaml>=6.0",
    "anthropic>=0.36.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
    "types-PyYAML>=6.0",
    "pytest-playwright>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/chenlinzhuo/video-to-notebook"
Repository = "https://github.com/chenlinzhuo/video-to-notebook"
Issues = "https://github.com/chenlinzhuo/video-to-notebook/issues"
Changelog = "https://github.com/chenlinzhuo/video-to-notebook/blob/main/CHANGELOG.md"

[project.scripts]
video-to-notebook = "video_to_notebook.cli:app"
# Back-compat alias for users migrating from v1.x (course-merger). The shim
# prints a deprecation notice on every invocation and will be removed in v3.0.0.
course-merger = "video_to_notebook.cli:course_merger_shim"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_to_notebook"]

[tool.hatch.build.targets.wheel.force-include]
"src/video_to_notebook/db/migrations" = "video_to_notebook/db/migrations"
"template-site" = "video_to_notebook/_template_site"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests (slower, may hit fs)",
    "e2e: browser-driven E2E tests (requires playwright install)",
]
