[project]
name = "course-merger"
version = "1.3.0"
description = "Crawl open-courseware, tag with concepts via Claude, and render an interactive textbook + concept encyclopedia"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "chenlinzhuo" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "yt-dlp>=2024.5.0",
    "pyyaml>=6.0",
    "anthropic>=0.36.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
    "types-PyYAML>=6.0",
    "pytest-playwright>=0.5.0",
]

[project.scripts]
course-merger = "course_merger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_merger"]

[tool.hatch.build.targets.wheel.force-include]
"src/course_merger/db/migrations" = "course_merger/db/migrations"
"template-site" = "course_merger/_template_site"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests (slower, may hit fs)",
    "e2e: browser-driven E2E tests (requires playwright install)",
]
